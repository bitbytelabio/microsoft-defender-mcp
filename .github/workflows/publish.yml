name: Publish crate

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Validate release and package version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "Package version: ${package_version}"

          if [[ "${EVENT_NAME}" == "release" ]]; then
            expected_tag="v${package_version}"
            if [[ "${RELEASE_TAG}" != "${expected_tag}" && "${RELEASE_TAG}" != "${package_version}" ]]; then
              echo "Release tag '${RELEASE_TAG}' does not match package version '${package_version}'" >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GIT_REF}" != "refs/heads/${DEFAULT_BRANCH}" && "${GIT_REF}" != refs/tags/v* ]]; then
              echo "Manual publication is restricted to default branch (${DEFAULT_BRANCH}) or release tags" >&2
              exit 1
            fi
          fi

          echo "Publishing microsoft-defender-mcp-server ${package_version}"
      - name: Verify package
        run: cargo package --locked

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked
